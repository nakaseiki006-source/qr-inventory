<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>棚卸入力システム</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
      font-size: 18px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    .label {
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .display {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 20px;
      background: #f2f2f2;
      border: 1px solid #ccc;
      border-radius: 5px;
      min-height: 24px;
      word-break: break-all;
    }

    select,
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: white;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      font-size: 20px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
    }

    button:disabled {
      background: #999;
    }
.button-row {
  display: flex;
  gap: 10px;
  max-width: 500px;
  margin: 0 auto;
}

.button-row button {
  flex: 1;
}
    #cancelButton {
      background: #777;
    }

    #nextButton {
      background: #28a745;
    }

    #resetButton {
      background: #dc3545;
      margin-top: 30px;
    }

    #result {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      min-height: 24px;
      white-space: pre-line;
    }

    .section {
      max-width: 500px;
      margin: 0 auto;
    }

    .modeButtons {
      max-width: 500px;
      margin: 0 auto;
    }

    .modeButtons button {
      margin-top: 10px;
    }

  </style>

</head>


<body>


<h2>ダイナマーク棚卸QR入力</h2>


<div class="section">

<!-- ========================================== -->
<!-- QR入力 -->
<!-- ========================================== -->

<button
  id="startButton"
  onclick="startCamera()">

  QRで入力（カメラを起動）

</button>


<!-- ========================================== -->
<!-- QRカメラ -->
<!-- ========================================== -->

<div id="reader"></div>



<!-- ========================================== -->
<!-- 大項目 -->
<!-- ========================================== -->

<div class="label">
  大項目
</div>


<select
  id="categorySelect"
  onchange="categoryChanged()">

  <option value="">
    大項目を選択してください
  </option>

</select>


<!-- ========================================== -->
<!-- 品名 -->
<!-- ========================================== -->

<div class="label">
  品名
</div>


<select
  id="partNameSelect"
  onchange="partNameChanged()">

  <option value="">
    品名を選択してください
  </option>

</select>


<!-- ========================================== -->
<!-- 品番 -->
<!-- ========================================== -->

<div class="label">
  品番
</div>


<div
  id="partNo"
  class="display">
</div>


<!-- ========================================== -->
<!-- 数量 -->
<!-- ========================================== -->

<div class="label">
  数量
</div>


<input
  type="number"
  id="quantity"
  inputmode="numeric"
  min="0"
  placeholder="数量を入力してください">
  
<div class="button-row">

  <button
    id="saveButton"
    onclick="saveData()">

    登録

  </button>


  <button
    id="nextButton"
    onclick="nextItem()">

    次へ

  </button>

</div>



<!-- ========================================== -->
<!-- キャンセル -->
<!-- ========================================== -->

<button
  id="cancelButton"
  onclick="cancelInput()">

  キャンセル

</button>


<!-- ========================================== -->
<!-- 結果 -->
<!-- ========================================== -->

<div id="result">

  商品マスタを読み込んでいます…

</div>


<!-- ========================================== -->
<!-- QRカメラ -->
<!-- ========================================== -->

<div id="reader"></div>


<button
  id="startButton"
  onclick="startCamera()">

  カメラを起動

</button>


<!-- ========================================== -->
<!-- リセット -->
<!-- ========================================== -->

<button
  id="resetButton"
  onclick="resetInventory()">

  棚卸データをリセット

</button>


</div>


<script>


// ==================================================
// Google Apps Script WebアプリURL
// ==================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbw-0Sxg0RJDsmUbntSCwcfLibbzH1D1u-rhWAryySAEIFWKnLlyfPwVx-N-u2IcyLfcGQ/exec";


// ==================================================
// マスタ
// ==================================================

let masterData = [];


// ==================================================
// 現在の入力モード
// manual = 手動
// qr     = QR
// ==================================================

let inputMode = "manual";


// ==================================================
// 現在選択している大項目のデータ
// ==================================================

let currentCategoryItems = [];


// ==================================================
// 現在の品名位置
// ==================================================

let currentItemIndex = -1;


// ==================================================
// QRカメラ
// ==================================================

let html5QrCode = null;

let scanning = false;

let cameraRunning = false;


// ==================================================
// ページ読み込み時
// ==================================================

window.onload = function() {

  loadMaster();

};


// ==================================================
// 商品マスタ読み込み
// ==================================================

function loadMaster() {

  const callbackName =
    "masterCallback_" + Date.now();


  window[callbackName] =
    function(data) {

      try {

        if (
          !data ||
          !data.ok
        ) {

          throw new Error(
            "マスタ取得エラー"
          );

        }


        masterData =
          data.items || [];


        setupCategorySelect();


        document.getElementById("result")
          .innerText =
          "大項目を選択してください";


      }

      catch (error) {

        console.log(error);

        document.getElementById("result")
          .innerText =
          "商品マスタを読み込めませんでした";

      }


      delete window[callbackName];

    };


  const script =
    document.createElement("script");


  script.src =
    GAS_URL +
    "?api=master&callback=" +
    callbackName;


  script.onerror =
    function() {

      document.getElementById("result")
        .innerText =
        "商品マスタの読み込みに失敗しました";

      delete window[callbackName];

    };


  document.body.appendChild(script);

}


// ==================================================
// 大項目リスト作成
// ==================================================

function setupCategorySelect() {

  const select =
    document.getElementById(
      "categorySelect"
    );


  select.innerHTML =
    '<option value="">大項目を選択してください</option>';


  const categories = [];


  for (
    let i = 0;
    i < masterData.length;
    i++
  ) {

    const category =
      masterData[i].category || "";


    if (
      category !== "" &&
      !categories.includes(category)
    ) {

      categories.push(category);

    }

  }


  for (
    let i = 0;
    i < categories.length;
    i++
  ) {

    const option =
      document.createElement("option");


    option.value =
      categories[i];


    option.textContent =
      categories[i];


    select.appendChild(option);

  }

}


// ==================================================
// 大項目変更
// ==================================================

function categoryChanged() {

  const category =
    document.getElementById(
      "categorySelect"
    ).value;


  const nameSelect =
    document.getElementById(
      "partNameSelect"
    );


  const partNo =
    document.getElementById(
      "partNo"
    );


  nameSelect.innerHTML =
    '<option value="">品名を選択してください</option>';


  partNo.innerText = "";


  currentCategoryItems = [];

  currentItemIndex = -1;


  if (category === "") {

    return;

  }


  // ------------------------------------------
  // 大項目が一致する商品をマスタ順で取得
  // ------------------------------------------

  for (
    let i = 0;
    i < masterData.length;
    i++
  ) {

    if (
      masterData[i].category === category
    ) {

      currentCategoryItems.push(
        masterData[i]
      );

    }

  }


  // ------------------------------------------
  // 品名プルダウン作成
  // ------------------------------------------

  for (
    let i = 0;
    i < currentCategoryItems.length;
    i++
  ) {

    const item =
      currentCategoryItems[i];


    const option =
      document.createElement("option");


    option.value =
      String(i);


    option.textContent =
      item.name;


    nameSelect.appendChild(option);

  }


  document.getElementById("result")
    .innerText =
    currentCategoryItems.length +
    "件あります。品名を選択してください";

}


// ==================================================
// 品名変更
// ==================================================

function partNameChanged() {

  const index =
    Number(
      document.getElementById(
        "partNameSelect"
      ).value
    );


  if (
    isNaN(index) ||
    !currentCategoryItems[index]
  ) {

    document.getElementById("partNo")
      .innerText = "";

    currentItemIndex = -1;

    return;

  }


  currentItemIndex =
    index;


  const item =
    currentCategoryItems[index];


  document.getElementById("partNo")
    .innerText =
    item.code;


  document.getElementById("quantity")
    .value = "";


  document.getElementById("quantity")
    .focus();


  document.getElementById("result")
    .innerText =
    "数量を入力してください";

}


// ==================================================
// 次へ
// ==================================================

function nextItem() {

  if (
    currentCategoryItems.length === 0
  ) {

    alert(
      "先に大項目を選択してください"
    );

    return;

  }


  let nextIndex;


  if (
    currentItemIndex < 0
  ) {

    nextIndex = 0;

  }

  else {

    nextIndex =
      currentItemIndex + 1;

  }


  // ------------------------------------------
  // 最後まで行った場合
  // ------------------------------------------

  if (
    nextIndex >=
    currentCategoryItems.length
  ) {

    alert(
      "この大項目の最後の商品です"
    );

    return;

  }


  currentItemIndex =
    nextIndex;


  const nameSelect =
    document.getElementById(
      "partNameSelect"
    );


  nameSelect.value =
    String(nextIndex);


  const item =
    currentCategoryItems[nextIndex];


  document.getElementById("partNo")
    .innerText =
    item.code;


  document.getElementById("quantity")
    .value = "";


  document.getElementById("result")
    .innerText =
    "次の商品です\n" +
    item.name;


  document.getElementById("quantity")
    .focus();

}








// ==================================================
// カメラ起動
// ==================================================

async function startCamera() {

  const button =
    document.getElementById(
      "startButton"
    );


  const result =
    document.getElementById(
      "result"
    );


  if (cameraRunning) {

    return;

  }


  button.disabled = true;


  result.innerText =
    "カメラを起動しています…";


  try {

    if (html5QrCode) {

      try {

        await html5QrCode.clear();

      }
      catch (e) {

      }

      html5QrCode = null;

    }


    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      function(errorMessage) {

      }

    );


    cameraRunning = true;

    scanning = true;


    result.innerText =
      "QRコードをカメラにかざしてください";


  }

  catch (error) {

    console.log(error);


    cameraRunning = false;

    scanning = false;


    result.innerText =
      "カメラを起動できませんでした";


    button.disabled = false;

  }

}


// ==================================================
// カメラ停止
// ==================================================

async function stopCamera() {

  if (
    html5QrCode &&
    cameraRunning
  ) {

    try {

      await html5QrCode.stop();

    }
    catch (error) {

      console.log(
        "カメラ停止エラー",
        error
      );

    }

  }


  cameraRunning = false;

  scanning = false;

}


// ==================================================
// QR読み取り成功
// ==================================================

async function onScanSuccess(
  decodedText
) {

  if (!scanning) {

    return;

  }


  scanning = false;


  await stopCamera();


  let code = "";

  let partName = "";


  // ------------------------------------------
  // QR解析
  // ------------------------------------------

  try {

    const url =
      new URL(decodedText);


    code =
      url.searchParams.get(
        "code"
      ) || "";


    partName =
      url.searchParams.get(
        "name"
      ) || "";

  }

  catch (e) {

    code =
      decodedText.trim();

  }


  // ------------------------------------------
  // 品名デコード
  // ------------------------------------------

  try {

    partName =
      decodeURIComponent(
        partName
      );

  }
  catch (e) {

  }


  // ------------------------------------------
  // マスタ検索
  // 品番＋品名で一致させる
  // ------------------------------------------

  let foundItem = null;


  for (
    let i = 0;
    i < masterData.length;
    i++
  ) {

    if (
      masterData[i].code === code &&
      masterData[i].name === partName
    ) {

      foundItem =
        masterData[i];

      break;

    }

  }


  // ------------------------------------------
  // マスタに存在した場合
  // ------------------------------------------

  if (foundItem) {

    // 大項目
    document.getElementById(
      "categorySelect"
    ).value =
      foundItem.category;


    // 大項目の品名一覧を再作成
    categoryChanged();


    // 品名を探す
    for (
      let i = 0;
      i < currentCategoryItems.length;
      i++
    ) {

      if (
        currentCategoryItems[i].code === code &&
        currentCategoryItems[i].name === partName
      ) {

        currentItemIndex =
          i;


        document.getElementById(
          "partNameSelect"
        ).value =
          String(i);


        break;

      }

    }


    // 品番
    document.getElementById("partNo")
      .innerText =
      foundItem.code;


    document.getElementById("result")
      .innerText =
      "読み取り完了\n数量を入力してください";


    document.getElementById("quantity")
      .value = "";


    document.getElementById("quantity")
      .focus();


    return;

  }


  // ------------------------------------------
  // マスタにない場合
  // ------------------------------------------

  document.getElementById("partNo")
    .innerText =
    code;


  document.getElementById("result")
    .innerText =
    "品番・品名を確認できましたが、\n" +
    "商品マスタに一致するデータがありません";


  document.getElementById("quantity")
    .value = "";

}


// ==================================================
// 登録
// ==================================================

function saveData() {

  const code =
    document.getElementById(
      "partNo"
    ).innerText.trim();


  const nameSelect =
    document.getElementById(
      "partNameSelect"
    );


  let partName = "";


  // ------------------------------------------
  // 品名取得
  // ------------------------------------------

  if (
    nameSelect.value !== ""
  ) {

    partName =
      nameSelect.options[
        nameSelect.selectedIndex
      ].text;

  }


  // ------------------------------------------
  // QRの場合の予備
  // ------------------------------------------

  if (
    partName === "" &&
    inputMode === "qr"
  ) {

    // QRでマスタに入った場合は
    // 品名プルダウンから取得できるため
    // 通常ここには来ない

    alert(
      "品名が選択されていません"
    );

    return;

  }


  const quantity =
    document.getElementById(
      "quantity"
    ).value.trim();


  if (code === "") {

    alert(
      "品番を選択してください"
    );

    return;

  }


  if (partName === "") {

    alert(
      "品名を選択してください"
    );

    return;

  }


  if (quantity === "") {

    alert(
      "数量を入力してください"
    );

    return;

  }


  if (
    Number(quantity) < 0
  ) {

    alert(
      "数量は0以上で入力してください"
    );

    return;

  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  const cancelButton =
    document.getElementById(
      "cancelButton"
    );


  const resetButton =
    document.getElementById(
      "resetButton"
    );


  saveButton.disabled = true;

  nextButton.disabled = true;

  cancelButton.disabled = true;

  resetButton.disabled = true;


  saveButton.innerText =
    "登録中…";


  document.getElementById("result")
    .innerText =
    "登録しています…";


  // ------------------------------------------
  // 隠しiframe
  // ------------------------------------------

  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.name =
    "saveFrame_" + Date.now();


  iframe.style.display =
    "none";


  document.body.appendChild(
    iframe
  );


  // ------------------------------------------
  // POSTフォーム
  // ------------------------------------------

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    GAS_URL;


  form.target =
    iframe.name;


  form.style.display =
    "none";


  addHiddenInput(
    form,
    "api",
    "save"
  );


  addHiddenInput(
    form,
    "code",
    code
  );


  addHiddenInput(
    form,
    "partName",
    partName
  );


  addHiddenInput(
    form,
    "quantity",
    quantity
  );


  document.body.appendChild(
    form
  );


  let submitted = false;


  iframe.onload =
    function() {

      if (!submitted) {

        return;

      }


      document.getElementById("result")
        .innerText =

        "登録しました\n\n" +

        "大項目：" +
        (
          document.getElementById(
            "categorySelect"
          ).value
        ) +

        "\n" +

        "品名：" +
        partName +

        "\n" +

        "品番：" +
        code +

        "\n" +

        "数量：" +
        quantity;


      document.getElementById(
        "quantity"
      ).value = "";


      saveButton.disabled = false;

      nextButton.disabled = false;

      cancelButton.disabled = false;

      resetButton.disabled = false;


      saveButton.innerText =
        "登録";


      form.remove();

      iframe.remove();


      // --------------------------------------
      // QRの場合だけカメラ再起動
      // --------------------------------------

      if (
        inputMode === "qr"
      ) {

        setTimeout(
          function() {

            document.getElementById(
              "result"
            ).innerText =
              "次のQRコードを読み取ってください";


            startCamera();

          },
          1500
        );

      }

      else {

        document.getElementById(
          "result"
        ).innerText =
          "登録しました。次の商品は「次へ」を押してください";

      }

    };


  submitted = true;


  form.submit();

}


// ==================================================
// キャンセル
// ==================================================

function cancelInput() {

  stopCamera();


  document.getElementById(
    "categorySelect"
  ).value = "";


  document.getElementById(
    "partNameSelect"
  ).innerHTML =
    '<option value="">品名を選択してください</option>';


  document.getElementById(
    "partNo"
  ).innerText = "";


  document.getElementById(
    "quantity"
  ).value = "";


  currentCategoryItems = [];

  currentItemIndex = -1;


  document.getElementById(
    "result"
  ).innerText =
    "入力をキャンセルしました";


  inputMode = "manual";

}


// ==================================================
// 棚卸データリセット
// ==================================================

function resetInventory() {

  const answer =
    confirm(

      "⚠️ 棚卸データをすべて消去します。\n\n" +

      "消去されるのは\n" +

      "・棚卸数\n" +
      "・登録日時\n\n" +

      "品名・品番は消えません。\n\n" +

      "本当にリセットしますか？"

    );


  if (!answer) {

    return;

  }


  const resetButton =
    document.getElementById(
      "resetButton"
    );


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  const cancelButton =
    document.getElementById(
      "cancelButton"
    );


  const result =
    document.getElementById(
      "result"
    );


  resetButton.disabled = true;

  saveButton.disabled = true;

  nextButton.disabled = true;

  cancelButton.disabled = true;


  result.innerText =
    "棚卸データをリセットしています…";


  stopCamera();


  // ------------------------------------------
  // 隠しiframe
  // ------------------------------------------

  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.name =
    "resetFrame_" + Date.now();


  iframe.style.display =
    "none";


  document.body.appendChild(
    iframe
  );


  // ------------------------------------------
  // POSTフォーム
  // ------------------------------------------

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    GAS_URL;


  form.target =
    iframe.name;


  form.style.display =
    "none";


  addHiddenInput(
    form,
    "api",
    "reset"
  );


  document.body.appendChild(
    form
  );


  let submitted = false;


  iframe.onload =
    function() {

      if (!submitted) {

        return;

      }


      result.innerText =
        "棚卸データをリセットしました";


      form.remove();

      iframe.remove();


      resetButton.disabled = false;

      saveButton.disabled = false;

      nextButton.disabled = false;

      cancelButton.disabled = false;


      setTimeout(
        function() {

          result.innerText =
            "大項目を選択してください";

        },
        1500
      );

    };


  submitted = true;


  form.submit();

}


// ==================================================
// hidden input作成
// ==================================================

function addHiddenInput(
  form,
  name,
  value
) {

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "hidden";


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}


</script>


</body>

</html>
