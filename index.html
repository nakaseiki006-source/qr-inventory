<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>棚卸QR入力</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
    }

    button:disabled {
      background: #999;
    }

    #result {
      font-size: 20px;
      margin-top: 20px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<h2>棚卸QR入力</h2>

<button id="startButton" onclick="startCamera()">
  カメラを起動
</button>

<div id="reader"></div>

<div id="result">
  「カメラを起動」を押してください
</div>

<script>

let html5QrCode = null;

async function startCamera() {

  const button = document.getElementById("startButton");
  const result = document.getElementById("result");

  button.disabled = true;

  result.innerText = "カメラを起動しています…";

  try {

    html5QrCode = new Html5Qrcode("reader");

    await html5QrCode.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      function(decodedText) {

        result.innerText =
          "読み取り成功！\n\n" + decodedText;

      },

      function(errorMessage) {
        // 読み取り失敗は表示しない
      }
    );

    result.innerText =
      "QRコードをカメラにかざしてください";

  } catch (error) {

    result.innerText =
      "カメラを起動できませんでした。\n\n" +
      error;

    button.disabled = false;
  }
}

</script>

</body>
</html>
