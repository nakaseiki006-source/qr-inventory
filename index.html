<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>棚卸QR入力</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
      font-size: 18px;
    }

    h2 {
      text-align: center;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    .label {
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .display {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 20px;
      background: #f2f2f2;
      border: 1px solid #ccc;
      border-radius: 5px;
      min-height: 24px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      font-size: 20px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
    }

    button:disabled {
      background: #999;
    }

    #result {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

  </style>

</head>


<body>

<h2>棚卸QR入力</h2>


<button id="startButton"
        onclick="startCamera()">

  カメラを起動

</button>


<div id="reader"></div>


<div id="result">
  QRコードを読み取ってください
</div>


<!-- 品名 -->

<div class="label">
  品名
</div>

<div id="partName"
     class="display">
</div>


<!-- 品番 -->

<div class="label">
  品番
</div>

<div id="partNo"
     class="display">
</div>


<!-- 数量 -->

<div class="label">
  数量
</div>

<input
  type="number"
  id="quantity"
  inputmode="numeric"
  min="0"
  placeholder="数量を入力してください"
>


<!-- 登録 -->

<button id="saveButton"
        onclick="saveData()">

  登録

</button>


<script>


// ========================================
// GAS WebアプリURL
// ========================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbw-0Sxg0RJDsmUbntSCwcfLibbzH1D1u-rhWAryySAEIFWKnLlyfPwVx-N-u2IcyLfcGQ/exec";


// ========================================
// カメラ
// ========================================

let html5QrCode = null;

let scanning = false;


// ========================================
// カメラ起動
// ========================================

async function startCamera() {

  const button =
    document.getElementById("startButton");

  const result =
    document.getElementById("result");


  button.disabled = true;

  result.innerText =
    "カメラを起動しています…";


  try {

    html5QrCode =
      new Html5Qrcode("reader");


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,

      function(errorMessage) {
        // 読み取り失敗は表示しない
      }

    );


    scanning = true;


    result.innerText =
      "QRコードをカメラにかざしてください";

  }

  catch (error) {

    result.innerText =
      "カメラを起動できませんでした";

    button.disabled = false;

  }

}


// ========================================
// QR読み取り
// ========================================

function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }


  // 連続読み取りを一旦停止

  scanning = false;


  let code =
    decodedText.trim();


  // QRの中身がURLの場合

  try {

    const url =
      new URL(decodedText);

    const id =
      url.searchParams.get("id");


    if (id) {
      code = id;
    }

  }

  catch (e) {

    // URLでなければ
    // そのまま品番として扱う

  }


  // 品番表示

  document.getElementById("partNo")
    .innerText = code;


  // 品名検索中

  document.getElementById("partName")
    .innerText = "品名を検索中…";


  document.getElementById("result")
    .innerText = "読み取り成功";


  // 数量欄をクリア

  document.getElementById("quantity")
    .value = "";


  // 品名検索

  lookupPart(code);

}


// ========================================
// 品名検索
// ========================================

function lookupPart(code) {

  const callbackName =
    "jsonp_" + Date.now();


  window[callbackName] =
    function(data) {

      // 後片付け

      delete window[callbackName];


      const script =
        document.getElementById(callbackName);

      if (script) {
        script.remove();
      }


      // 検索結果

      if (data.ok) {

        document.getElementById("partName")
          .innerText = data.partName;


        document.getElementById("result")
          .innerText = "品番を確認してください";


        // 数量入力へ移動

        document.getElementById("quantity")
          .focus();

      }
      else {

        document.getElementById("partName")
          .innerText = "品名が見つかりません";


        document.getElementById("result")
          .innerText = "マスタに品番がありません";

      }

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    GAS_URL +
    "?api=lookup" +
    "&id=" +
    encodeURIComponent(code) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      document.getElementById("partName")
        .innerText = "検索エラー";

      document.getElementById("result")
        .innerText =
          "Googleスプレッドシートに接続できません";

    };


  document.body.appendChild(script);

}


// ========================================
// 登録
// ========================================

function saveData() {

  const code =
    document.getElementById("partNo")
      .innerText;


  const quantity =
    document.getElementById("quantity")
      .value;


  if (code === "") {

    alert(
      "先にQRコードを読み取ってください"
    );

    return;

  }


  if (quantity === "") {

    alert(
      "数量を入力してください"
    );

    return;

  }


  // 現在は登録テスト

  alert(
    "登録テスト\n\n" +
    "品番：" + code + "\n" +
    "数量：" + quantity
  );

}

</script>

</body>

</html>
