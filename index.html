<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>棚卸QR入力</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
      font-size: 18px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    .label {
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .display {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 20px;
      background: #f2f2f2;
      border: 1px solid #ccc;
      border-radius: 5px;
      min-height: 24px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      font-size: 20px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
    }

    button:disabled {
      background: #999;
    }

    #result {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      min-height: 24px;
    }

  </style>

</head>


<body>

<h2>棚卸QR入力</h2>


<!-- ============================== -->
<!-- カメラ起動 -->
<!-- ============================== -->

<button id="startButton"
        onclick="startCamera()">

  カメラを起動

</button>


<!-- ============================== -->
<!-- QRカメラ -->
<!-- ============================== -->

<div id="reader"></div>


<!-- ============================== -->
<!-- メッセージ -->
<!-- ============================== -->

<div id="result">
  QRコードを読み取ってください
</div>


<!-- ============================== -->
<!-- 品名 -->
<!-- ============================== -->

<div class="label">
  品名
</div>

<div id="partName"
     class="display">
</div>


<!-- ============================== -->
<!-- 品番 -->
<!-- ============================== -->

<div class="label">
  品番
</div>

<div id="partNo"
     class="display">
</div>


<!-- ============================== -->
<!-- 数量 -->
<!-- ============================== -->

<div class="label">
  数量
</div>

<input
  type="number"
  id="quantity"
  inputmode="numeric"
  min="0"
  placeholder="数量を入力してください"
>


<!-- ============================== -->
<!-- 登録 -->
<!-- ============================== -->

<button id="saveButton"
        onclick="saveData()">

  登録

</button>


<script>


// ==================================================
// Google Apps Script WebアプリURL
// ==================================================

const GAS_URL =
  "ここにGASのURL";


// ==================================================
// QRカメラ
// ==================================================

let html5QrCode = null;

let scanning = false;


// ==================================================
// カメラ起動
// ==================================================

async function startCamera() {

  const button =
    document.getElementById("startButton");

  const result =
    document.getElementById("result");


  button.disabled = true;

  result.innerText =
    "カメラを起動しています…";


  try {

    html5QrCode =
      new Html5Qrcode("reader");


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,

      function(errorMessage) {

        // QR読み取り失敗は表示しない

      }

    );


    scanning = true;


    result.innerText =
      "QRコードをカメラにかざしてください";

  }

  catch (error) {

    result.innerText =
      "カメラを起動できませんでした";


    button.disabled = false;

  }

}


// ==================================================
// QR読み取り成功
// ==================================================

function onScanSuccess(decodedText) {

  // 連続読み取り防止

  if (!scanning) {
    return;
  }


  scanning = false;


  // ----------------------------------------------
  // QRの内容を取得
  // ----------------------------------------------

  let code =
    decodedText.trim();


  // ----------------------------------------------
  // QRがURLの場合
  // ?id=品番 を取得
  // ----------------------------------------------

  try {

    const url =
      new URL(decodedText);


    const id =
      url.searchParams.get("id");


    if (id) {

      code = id;

    }

  }

  catch (e) {

    // URLでなければ
    // 読み取った文字をそのまま品番として使用

  }


  // ----------------------------------------------
  // 品番表示
  // ----------------------------------------------

  document.getElementById("partNo")
    .innerText = code;


  // ----------------------------------------------
  // 品名検索中
  // ----------------------------------------------

  document.getElementById("partName")
    .innerText = "品名を検索中…";


  document.getElementById("result")
    .innerText = "読み取り成功";


  // ----------------------------------------------
  // 数量をクリア
  // ----------------------------------------------

  document.getElementById("quantity")
    .value = "";


  // ----------------------------------------------
  // 品名検索
  // ----------------------------------------------

  lookupPart(code);

}


// ==================================================
// 品名検索
// ==================================================

function lookupPart(code) {


  const callbackName =
    "jsonp_" + Date.now();


  // ----------------------------------------------
  // JSONP受信
  // ----------------------------------------------

  window[callbackName] =
    function(data) {


      // --------------------------------------------
      // 後片付け
      // --------------------------------------------

      delete window[callbackName];


      const script =
        document.getElementById(callbackName);


      if (script) {

        script.remove();

      }


      // --------------------------------------------
      // 品名が見つかった
      // --------------------------------------------

      if (data.ok) {


        document.getElementById("partName")
          .innerText = data.partName;


        document.getElementById("result")
          .innerText =
            "品番を確認して数量を入力してください";


        // 数量欄へカーソル

        document.getElementById("quantity")
          .focus();


      }


      // --------------------------------------------
      // 品名が見つからない
      // --------------------------------------------

      else {


        document.getElementById("partName")
          .innerText =
            "品名が見つかりません";


        document.getElementById("result")
          .innerText =
            "マスタに品番がありません";


        // 次のQRを読めるようにする

        scanning = true;

      }

    };


  // ----------------------------------------------
  // JSONP用script
  // ----------------------------------------------

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    GAS_URL +
    "?api=lookup" +
    "&id=" +
    encodeURIComponent(code) +
    "&callback=" +
    callbackName;


  // ----------------------------------------------
  // 通信エラー
  // ----------------------------------------------

  script.onerror =
    function() {


      delete window[callbackName];


      script.remove();


      document.getElementById("partName")
        .innerText =
          "検索エラー";


      document.getElementById("result")
        .innerText =
          "Googleスプレッドシートに接続できません";


      // 再度QRを読めるようにする

      scanning = true;

    };


  document.body.appendChild(script);

}


// ==================================================
// 登録
// ==================================================

function saveData() {


  const code =
    document.getElementById("partNo")
      .innerText.trim();


  const partName =
    document.getElementById("partName")
      .innerText.trim();


  const quantity =
    document.getElementById("quantity")
      .value.trim();


  // ----------------------------------------------
  // 品番チェック
  // ----------------------------------------------

  if (code === "") {

    alert(
      "先にQRコードを読み取ってください"
    );

    return;

  }


  // ----------------------------------------------
  // 数量チェック
  // ----------------------------------------------

  if (quantity === "") {

    alert(
      "数量を入力してください"
    );

    return;

  }


  // ----------------------------------------------
  // 数量のチェック
  // ----------------------------------------------

  if (Number(quantity) < 0) {

    alert(
      "数量は0以上で入力してください"
    );

    return;

  }


  // ----------------------------------------------
  // 登録ボタンを無効化
  // ----------------------------------------------

  const button =
    document.getElementById("saveButton");


  button.disabled = true;

  button.innerText =
    "登録中…";


  document.getElementById("result")
    .innerText =
      "登録しています…";


  // ----------------------------------------------
  // 隠しiframe作成
  // ----------------------------------------------

  const iframe =
    document.createElement("iframe");


  iframe.name =
    "saveFrame_" + Date.now();


  iframe.style.display =
    "none";


  document.body.appendChild(iframe);


  // ----------------------------------------------
  // フォーム作成
  // ----------------------------------------------

  const form =
    document.createElement("form");


  form.method =
    "POST";


  form.action =
    GAS_URL;


  form.target =
    iframe.name;


  form.style.display =
    "none";


  // ----------------------------------------------
  // API指定
  // ----------------------------------------------

  addHiddenInput(
    form,
    "api",
    "save"
  );


  // ----------------------------------------------
  // 品番
  // ----------------------------------------------

  addHiddenInput(
    form,
    "code",
    code
  );


  // ----------------------------------------------
  // 数量
  // ----------------------------------------------

  addHiddenInput(
    form,
    "quantity",
    quantity
  );


  document.body.appendChild(form);


  // ----------------------------------------------
  // 登録完了監視
  // ----------------------------------------------

  let submitted = false;


  iframe.onload =
    function() {


      if (!submitted) {

        return;

      }


      // --------------------------------------------
      // 登録完了
      // --------------------------------------------

      document.getElementById("result")
        .innerText =
          "登録しました";


      // --------------------------------------------
      // 登録内容を表示
      // --------------------------------------------

      alert(

        "登録しました\n\n" +

        "品名：" +
        partName +
        "\n" +

        "品番：" +
        code +
        "\n" +

        "数量：" +
        quantity

      );


      // --------------------------------------------
      // 数量クリア
      // --------------------------------------------

      document.getElementById("quantity")
        .value = "";


      // --------------------------------------------
      // 登録ボタン復帰
      // --------------------------------------------

      button.disabled = false;

      button.innerText =
        "登録";


      // --------------------------------------------
      // 次のQRを読めるようにする
      // --------------------------------------------

      scanning = true;


      document.getElementById("result")
        .innerText =
          "次のQRコードを読み取ってください";


      // --------------------------------------------
      // フォーム・iframe削除
      // --------------------------------------------

      setTimeout(

        function() {

          form.remove();

          iframe.remove();

        },

        1000

      );

    };


  // ----------------------------------------------
  // GASへ送信
  // ----------------------------------------------

  submitted = true;

  form.submit();

}


// ==================================================
// hidden input作成
// ==================================================

function addHiddenInput(
  form,
  name,
  value
) {


  const input =
    document.createElement("input");


  input.type =
    "hidden";


  input.name =
    name;


  input.value =
    value;


  form.appendChild(input);

}

</script>

</body>

</html>
