<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ダイナマーク棚卸QR入力</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
      font-size: 18px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    .label {
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .display {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 20px;
      background: #f2f2f2;
      border: 1px solid #ccc;
      border-radius: 5px;
      min-height: 24px;
      word-break: break-all;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      font-size: 20px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
    }

    button:disabled {
      background: #999;
    }

    #result {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      min-height: 24px;
      white-space: pre-line;
    }

  </style>

</head>

<body>

<h2>棚卸QR入力</h2>

<button id="startButton"
        onclick="startCamera()">
  カメラを起動
</button>

<div id="reader"></div>

<div id="result">
  QRコードを読み取ってください
</div>

<div class="label">
  品名
</div>

<div id="partName"
     class="display">
</div>

<div class="label">
  品番
</div>

<div id="partNo"
     class="display">
</div>

<div class="label">
  数量
</div>

<input
  type="number"
  id="quantity"
  inputmode="numeric"
  min="0"
  placeholder="数量を入力してください"
>

<button id="saveButton"
        onclick="saveData()">
  登録
</button>


<script>

// ==================================================
// Google Apps Script WebアプリURL
// ==================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbw-0Sxg0RJDsmUbntSCwcfLibbzH1D1u-rhWAryySAEIFWKnLlyfPwVx-N-u2IcyLfcGQ/exec";


// ==================================================
// QRカメラ
// ==================================================

let html5QrCode = null;
let scanning = false;
let cameraRunning = false;


// ==================================================
// カメラ起動
// ==================================================

async function startCamera() {

  const button =
    document.getElementById("startButton");

  const result =
    document.getElementById("result");

  if (cameraRunning) {
    return;
  }

  button.disabled = true;

  result.innerText =
    "カメラを起動しています…";

  try {

    // 古いインスタンスがあれば作り直す
    if (html5QrCode) {

      try {

        await html5QrCode.clear();

      }
      catch (e) {
        // 無視
      }

      html5QrCode = null;
    }

    html5QrCode =
      new Html5Qrcode("reader");

    await html5QrCode.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      onScanSuccess,
      function(errorMessage) {
        // 読み取り失敗は表示しない
      }
    );

    cameraRunning = true;
    scanning = true;

    result.innerText =
      "QRコードをカメラにかざしてください";

  }
  catch (error) {

    console.log(error);

    cameraRunning = false;
    scanning = false;

    result.innerText =
      "カメラを起動できませんでした";

    button.disabled = false;
  }
}


// ==================================================
// カメラ停止
// ==================================================

async function stopCamera() {

  if (
    html5QrCode &&
    cameraRunning
  ) {

    try {

      await html5QrCode.stop();

    }
    catch (error) {

      console.log(
        "カメラ停止エラー",
        error
      );

    }

  }

  cameraRunning = false;
  scanning = false;
}


// ==================================================
// QR読み取り成功
// ==================================================

async function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }

  // まず読み取りを止める
  scanning = false;

  // カメラそのものも停止
  await stopCamera();

  let code =
    decodedText.trim();


  // ==================================================
  // QRがURLの場合
  // ?id=品番 を取得
  // ==================================================

  try {

    const url =
      new URL(decodedText);

    const id =
      url.searchParams.get("id");

    if (id) {
      code = id;
    }

  }
  catch (e) {

    // URLでなければそのまま品番
  }


  document.getElementById("partNo")
    .innerText = code;

  document.getElementById("partName")
    .innerText = "品名を検索中…";

  document.getElementById("result")
    .innerText = "読み取り成功";

  document.getElementById("quantity")
    .value = "";

  lookupPart(code);
}


// ==================================================
// 品名検索
// ==================================================

function lookupPart(code) {

  const callbackName =
    "jsonp_" + Date.now();

  window[callbackName] =
    function(data) {

      delete window[callbackName];

      const script =
        document.getElementById(callbackName);

      if (script) {
        script.remove();
      }


      if (data.ok) {

        document.getElementById("partName")
          .innerText =
            data.partName;

        document.getElementById("result")
          .innerText =
            "品番を確認して数量を入力してください";

        document.getElementById("quantity")
          .focus();

      }
      else {

        document.getElementById("partName")
          .innerText =
            "品名が見つかりません";

        document.getElementById("result")
          .innerText =
            "マスタに品番がありません";

        // カメラ再開
        startCamera();
      }
    };


  const script =
    document.createElement("script");

  script.id =
    callbackName;

  script.src =
    GAS_URL +
    "?api=lookup" +
    "&id=" +
    encodeURIComponent(code) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      document.getElementById("partName")
        .innerText =
        "検索エラー";

      document.getElementById("result")
        .innerText =
        "Googleスプレッドシートに接続できません";

      // カメラ再開
      startCamera();
    };


  document.body.appendChild(script);
}


// ==================================================
// 登録
// ==================================================

function saveData() {

  const code =
    document.getElementById("partNo")
      .innerText.trim();

  const partName =
    document.getElementById("partName")
      .innerText.trim();

  const quantity =
    document.getElementById("quantity")
      .value.trim();


  if (code === "") {

    alert(
      "先にQRコードを読み取ってください"
    );

    return;
  }


  if (quantity === "") {

    alert(
      "数量を入力してください"
    );

    return;
  }


  if (Number(quantity) < 0) {

    alert(
      "数量は0以上で入力してください"
    );

    return;
  }


  const button =
    document.getElementById("saveButton");

  button.disabled = true;

  button.innerText =
    "登録中…";

  document.getElementById("result")
    .innerText =
    "登録しています…";


  // ==================================================
  // 隠しiframe
  // ==================================================

  const iframe =
    document.createElement("iframe");

  iframe.name =
    "saveFrame_" + Date.now();

  iframe.style.display =
    "none";

  document.body.appendChild(iframe);


  // ==================================================
  // POSTフォーム
  // ==================================================

  const form =
    document.createElement("form");

  form.method =
    "POST";

  form.action =
    GAS_URL;

  form.target =
    iframe.name;

  form.style.display =
    "none";


  addHiddenInput(
    form,
    "api",
    "save"
  );

  addHiddenInput(
    form,
    "code",
    code
  );

  addHiddenInput(
    form,
    "quantity",
    quantity
  );


  document.body.appendChild(form);


  let submitted = false;


  iframe.onload =
    function() {

      if (!submitted) {
        return;
      }


      document.getElementById("result")
        .innerText =
        "登録しました\n\n" +
        "品名：" + partName +
        "\n" +
        "品番：" + code +
        "\n" +
        "数量：" + quantity;


      document.getElementById("quantity")
        .value = "";


      button.disabled = false;

      button.innerText =
        "登録";


      form.remove();
      iframe.remove();


      // ==================================================
      // 少し待ってから次のQR用カメラ起動
      // ==================================================

      setTimeout(
        function() {

          document.getElementById("result")
            .innerText =
            "次のQRコードを読み取ってください";

          startCamera();

        },
        2000
      );

    };


  submitted = true;

  form.submit();
}


// ==================================================
// hidden input作成
// ==================================================

function addHiddenInput(
  form,
  name,
  value
) {

  const input =
    document.createElement("input");

  input.type =
    "hidden";

  input.name =
    name;

  input.value =
    value;

  form.appendChild(input);
}

</script>

</body>
</html>
