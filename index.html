<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QRカメラテスト</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      font-size: 20px;
      margin-top: 20px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<h2>QRカメラテスト</h2>

<div id="reader"></div>

<div id="result">
  QRを読み取ってください
</div>

<script>

function onScanSuccess(decodedText) {

  document.getElementById("result").innerText =
    "読み取り成功！\n" + decodedText;

}

const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: {
      width: 250,
      height: 250
    }
  },
  false
);

scanner.render(
  onScanSuccess,
  function(errorMessage) {
    // 読み取り失敗は表示しない
  }
);

</script>

</body>
</html>
